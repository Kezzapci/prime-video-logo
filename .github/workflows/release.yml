name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Windows FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg | Out-Null
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg" -Force
          $ffmpeg = Get-ChildItem -Path "$env:RUNNER_TEMP/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          Copy-Item $ffmpeg.FullName vendor/ffmpeg/ffmpeg.exe -Force

      - name: Build setup and portable EXE
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate updater metadata
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'PrimeVideoLogo-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup bulunamadı.' }
          $hashHex = (Get-FileHash -Path $setup.FullName -Algorithm SHA512).Hash
          $hashBytes = New-Object byte[] ($hashHex.Length / 2)
          for ($i = 0; $i -lt $hashHex.Length; $i += 2) {
            $hashBytes[$i / 2] = [Convert]::ToByte($hashHex.Substring($i, 2), 16)
          }
          $sha512 = [Convert]::ToBase64String($hashBytes)
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $releaseDate = (Get-Date).ToUniversalTime().ToString('o')
          $metadata = @"
          version: $version
          files:
            - url: $($setup.Name)
              sha512: $sha512
              size: $($setup.Length)
          path: $($setup.Name)
          sha512: $sha512
          size: $($setup.Length)
          releaseDate: $releaseDate
          "@
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist/latest.yml'), $metadata, (New-Object System.Text.UTF8Encoding($false)))

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.exe dist/latest.yml --repo "${GITHUB_REPOSITORY}" --clobber
          else
            for attempt in 1 2 3; do
              if gh release create "${GITHUB_REF_NAME}" dist/*.exe dist/latest.yml --repo "${GITHUB_REPOSITORY}" --title "Prime Video Logo ${GITHUB_REF_NAME}" --generate-notes; then
                exit 0
              fi
              echo "GitHub Release denemesi ${attempt} başarısız oldu; yeniden deneniyor..."
              sleep 20
            done
            exit 1
          fi
